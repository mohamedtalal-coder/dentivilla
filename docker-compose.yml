services:
  postgres:
    image: postgres:16-alpine
    container_name: dentivilla-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: dentivilla
      POSTGRES_PASSWORD: dentivilla
      POSTGRES_DB: dentivilla
    ports:
      - "5432:5432"
    volumes:
      - dentivilla_pg:/var/lib/postgresql/data

volumes:
  dentivilla_pg:
